# Ruff configuration for Python validation
target-version = "py39"

# Include/exclude patterns
include = ["*.py", "*.pyi", "**/pyproject.toml"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

# Line length (matching flake8 config)
line-length = 127

[lint]
# Enable these rule categories
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "RUF",  # Ruff-specific rules
]

# Ignore these specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E731",   # Do not assign a lambda expression
    "B008",   # Do not perform function calls in argument defaults
    "B904",   # Use raise from exception
    "SIM105", # Use contextlib.suppress
    "TC001",  # Move import into type-checking block
    "TC002",  # Move import into type-checking block
    "TC003",  # Move import into type-checking block
    "F821",   # Undefined name (we have some dynamic imports)
]

# Configure specific rules
[lint.per-file-ignores]
"test_*.py" = ["F401", "F841"]  # Allow unused imports and variables in tests
"__init__.py" = ["F401"]         # Allow unused imports in __init__ files
"openai_server.py" = ["F821"]    # Allow undefined names (FastAPI background tasks)

[lint.isort]
known-first-party = ["utils", "tool_parser", "model_manager"]

[lint.mccabe]
max-complexity = 10