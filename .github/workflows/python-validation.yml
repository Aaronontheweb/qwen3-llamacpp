name: Python Validation

on:
  push:
    branches: [ master, main ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/python-validation.yml'
      - 'ruff.toml'
      - '.flake8'
  pull_request:
    branches: [ master, main ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/python-validation.yml'
      - 'ruff.toml'
      - '.flake8'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install development dependencies
      run: |
        python -m pip install --upgrade pip
        # Use CI-specific requirements that exclude GPU dependencies
        if [ -f requirements-ci.txt ]; then
          pip install -r requirements-ci.txt
        else
          # Fallback to filtering requirements.txt if CI file doesn't exist
          pip install ruff flake8 mypy pytest
          grep -v -E '(llama-cpp-python|vllm|torch|transformers|accelerate|bitsandbytes|pynvml)' requirements.txt > requirements-no-gpu.txt || true
          pip install -r requirements-no-gpu.txt || true
        fi
    
    - name: Check Python syntax
      run: |
        python -m py_compile *.py utils/*.py
    
    - name: Lint with ruff
      run: |
        # Run full ruff check - will fail on any linting errors
        ruff check .
    
    - name: Lint with flake8
      run: |
        # Run full flake8 check - will fail on any linting errors
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type check with mypy
      run: |
        # Run mypy on files that don't require GPU dependencies
        # Skip GPU-dependent files entirely to avoid import issues
        mypy . \
          --exclude 'backends/vllm_backend\.py' \
          --exclude 'backends/llama_backend\.py' \
          --exclude 'test_vllm_backend\.py' \
          --exclude 'test_local\.py' \
          --ignore-missing-imports \
          --no-strict-optional \
          --warn-return-any \
          --warn-unreachable \
          --allow-untyped-defs \
          --allow-incomplete-defs
    
    - name: Run basic tests (if any exist)
      run: |
        # Check if there are any test files that don't require GPU
        if [ -d "tests" ]; then
          pytest tests/ -v --ignore=tests/gpu --ignore=tests/model || true
        else
          echo "No tests directory found, skipping pytest"
        fi