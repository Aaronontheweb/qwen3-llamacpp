name: Python Validation

on:
  push:
    branches: [ master, main ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/python-validation.yml'
      - 'ruff.toml'
      - '.flake8'
  pull_request:
    branches: [ master, main ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/python-validation.yml'
      - 'ruff.toml'
      - '.flake8'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install development dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff flake8 mypy pytest
        # Install main requirements except llama-cpp-python (requires GPU)
        grep -v llama-cpp-python requirements.txt > requirements-no-gpu.txt || true
        pip install -r requirements-no-gpu.txt || true
    
    - name: Check Python syntax
      run: |
        python -m py_compile *.py utils/*.py
    
    - name: Lint with ruff
      run: |
        # Run full ruff check - will fail on any linting errors
        ruff check .
    
    - name: Lint with flake8
      run: |
        # Run full flake8 check - will fail on any linting errors
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type check with mypy (best effort)
      run: |
        # Run mypy with lenient settings since we can't install all dependencies
        mypy . --ignore-missing-imports --no-strict-optional --warn-return-any --warn-unreachable --allow-untyped-defs --allow-incomplete-defs || true
    
    - name: Check imports (without GPU dependencies)
      run: |
        # Create a simple import test script
        cat > test_imports.py << 'EOF'
        import sys
        import importlib.util
        from pathlib import Path
        
        # Files to check
        python_files = list(Path('.').glob('**/*.py'))
        
        # Modules to skip (GPU/model dependent)
        skip_modules = {'llama_cpp', 'torch', 'tensorflow', 'transformers'}
        skip_files = {'llama_backend.py', 'test_local.py'}  # Files that directly use llama-cpp
        
        errors = []
        for file in python_files:
            if file.name in skip_files:
                print(f"Skipping {file} (GPU/model dependent)")
                continue
                
            # Read and parse imports
            try:
                with open(file, 'r') as f:
                    content = f.read()
                    # Simple import detection (not perfect but good enough)
                    lines = content.split('\n')
                    for i, line in enumerate(lines, 1):
                        if line.strip().startswith(('import ', 'from ')) and not line.strip().startswith('#'):
                            # Extract module name
                            if line.strip().startswith('import '):
                                module = line.strip().split()[1].split('.')[0].split(',')[0]
                            else:  # from X import Y
                                module = line.strip().split()[1].split('.')[0]
                            
                            if module in skip_modules:
                                print(f"Skipping {module} import in {file}:{i} (GPU/model dependent)")
                                continue
                            
                            # Try to find the module
                            spec = importlib.util.find_spec(module)
                            if spec is None and module not in ['utils', 'tool_parser', 'llama_backend']:  # Local modules
                                errors.append(f"{file}:{i} - Cannot find module '{module}'")
            except Exception as e:
                errors.append(f"{file} - Error parsing: {e}")
        
        if errors:
            print("\nImport errors found:")
            for error in errors:
                print(f"  {error}")
            sys.exit(1)
        else:
            print("\nAll imports validated successfully (GPU/model imports skipped)")
        EOF
        python test_imports.py
        rm test_imports.py
    
    - name: Run basic tests (if any exist)
      run: |
        # Check if there are any test files that don't require GPU
        if [ -d "tests" ]; then
          pytest tests/ -v --ignore=tests/gpu --ignore=tests/model || true
        else
          echo "No tests directory found, skipping pytest"
        fi